apiVersion: v2
name: resurface
version: 3.9.0
type: application
description: Resurface discovers and alerts on quality and security signatures in your API traffic.
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: added
      description: Support for Azure Storage as remote object storage for Iceberg
    - kind: added
      description: Support for PII detection introduced in Graylog API Security 3.7
    - kind: changed
      description: Upgrade Resurface image to 3.7.84
    - kind: changed
      description: Use specific tag for MinIO image to address AWS S3 new checksums used by Trino
keywords:
  - API
  - HTTP
  - SOAP
  - REST
  - GraphQL
  - Triage
  - Security
  - Observability
  - Logs
  - Monitoring
  - Troubleshooting
  - Alerts
home: https://resurface.io
dependencies:
  - name: kubernetes-ingress
    version: "1.39.4"
    repository: https://haproxytech.github.io/helm-charts
    condition: ingress.controller.enabled
  - name: minio
    version: "5.4.0"
    repository: https://charts.min.io/
    condition: minio.enabled
maintainers:
  - name: Ramón Márquez
    email: ramon@resurface.io
  - name: Rob Dickinson
    email: rob@resurface.io
sources:
  - https://github.com/resurfaceio
icon: https://raw.githubusercontent.com/resurfaceio/insomnia-plugin/master/assets/plugin/icon-alt.svg
appVersion: 3.7.84
